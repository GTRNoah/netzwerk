<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Keine Netzwerkverbindungen erlaubt: alle Daten bleiben lokal -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'">
<title>Mein Netzwerk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Netzwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#121826">
<style>
  :root {
    --bg: #0a0e18;
    --panel: #121826;
    --panel-2: #182032;
    --line: #253049;
    --text: #e6ebf5;
    --muted: #8b96ad;
    --accent: #5eead4;
    --d0: #fbbf24;
    --d1: #5eead4;
    --d2: #a78bfa;
    --d3: #fb923c;
    --cross: #f472b6;
    --danger: #f87171;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 52px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: .2px; }
  header .stats { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 12px; margin-right: 4px; white-space: nowrap; }
  .status.warn { color: var(--d3); }

  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; white-space: nowrap; }
  .btn:hover { border-color: #3a4868; }
  .btn.primary { background: var(--accent); color: #062421; border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  select.btn { padding: 5px 8px; }

  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .search { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .search input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
  .filter-label button { background: none; border: 0; color: var(--accent); font-size: 11px; padding: 0; text-transform: none; letter-spacing: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; max-height: 96px; overflow: auto; }
  .chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .chip .n { color: var(--muted); margin-left: 3px; }
  .chip.on { background: var(--accent); color: #062421; border-color: var(--accent); }
  .chip.on .n { color: #0d4a43; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .chip.topic { border-color: #3d3566; }
  .chip.topic.on { background: var(--d2); border-color: var(--d2); color: #1b1037; font-weight: 600; }
  .chip.topic.on .n { color: #3b2a70; }
  .none { color: var(--muted); font-size: 12px; }

  .list-head { padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .list-head b { color: var(--text); }
  .linkbtn { background: none; border: 0; color: var(--accent); padding: 0 0 0 6px; font-size: 12px; }
  .linkbtn:hover { text-decoration: underline; }
  .list { overflow: auto; flex: 1; }
  .item { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 9px 12px; border-bottom: 1px solid #1a2233; cursor: pointer; }
  .item:hover { background: var(--panel-2); }
  .item.sel { background: #1c2740; }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
  .item .name { font-weight: 600; }
  .item .sub, .item .route { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .route { font-size: 11px; }
  .item .tags { font-size: 11px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
  .empty .btn { margin-top: 10px; }

  main { display: flex; min-width: 0; min-height: 0; }
  .stage { position: relative; flex: 1; min-width: 0; }
  #graph { position: absolute; inset: 0; }
  .legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 12px; font-size: 12px; color: var(--muted);
    background: rgba(18,24,38,.8); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
  .legend { flex-wrap: wrap; row-gap: 4px; max-width: calc(100% - 28px); }
  .legend span { white-space: nowrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .legend i.dash { width: 16px; height: 0; border-radius: 0; border-top: 2px dashed var(--cross); vertical-align: 3px; }
  .hint { position: absolute; right: 14px; top: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .viewtoggle { position: absolute; left: 14px; top: 10px; display: flex; background: rgba(18,24,38,.92);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden; z-index: 2; }
  .viewtoggle[hidden] { display: none; }
  .viewtoggle button { background: none; border: 0; padding: 5px 11px; font-size: 12px; color: var(--muted); }
  .viewtoggle button.on { background: var(--panel-2); color: var(--text); }
  .graphbtns { position: absolute; right: 14px; bottom: 12px; display: flex; gap: 6px; z-index: 2; }
  .graphbtns button { background: rgba(18,24,38,.92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font-size: 12px; color: var(--muted); }
  .graphbtns button.on { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 760px) { .graphbtns { bottom: auto; top: 52px; } }
  .scene-tooltip { font: 12px/1.4 "Segoe UI", sans-serif !important; }
  .tip { background: rgba(18,24,38,.95); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; color: var(--text); }
  .tip small { color: var(--muted); }

  .panel { width: 0; overflow: hidden; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; flex-shrink: 0; }
  .panel > * { min-width: 369px; }
  main:has(.panel.open) .hint { display: none; }
  .panel.open { width: 370px; }
  .panel-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .panel-head h2 { margin: 0; font-size: 19px; }
  .panel-head .sub { color: var(--muted); font-size: 13px; }
  .panel-head .x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 4px; }
  .panel-body { padding: 14px 16px; overflow: auto; overflow-x: hidden; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
  .panel-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; margin-top: 5px; }
  .path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; }
  .path a { color: var(--text); text-decoration: none; background: var(--panel-2); padding: 2px 8px; border-radius: 6px; cursor: pointer; }
  .path a:hover { background: #22304c; }
  .path b { background: var(--accent); color: #062421; padding: 2px 8px; border-radius: 6px; }
  .path .arr { color: var(--muted); }
  .path .arr.cross { color: var(--cross); }
  .field .k { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 3px; }
  .field .v { white-space: pre-wrap; word-break: break-word; }
  .field a { color: var(--accent); }
  .field .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .stars { color: var(--d0); letter-spacing: 2px; }
  .kids { display: flex; flex-wrap: wrap; gap: 5px; }
  .copy { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 0 4px; }
  .copy:hover { color: var(--text); }
  .chip.xlink { display: inline-flex; padding: 0; overflow: hidden; border-color: #5a2a48; }
  .chip.xlink button { background: none; border: 0; padding: 2px 4px 2px 9px; font-size: 12px; }
  .chip.xlink .rm { padding: 2px 8px 2px 4px; color: var(--muted); }
  .chip.xlink .rm:hover { color: var(--danger); }
  .addlink { width: 100%; margin-top: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; color: var(--muted); }

  form.edit { display: grid; gap: 11px; }
  form.edit label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  form.edit input, form.edit select, form.edit textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; color: var(--text); font-size: 14px; }
  form.edit input:focus, form.edit select:focus, form.edit textarea:focus { border-color: var(--accent); }
  form.edit textarea { min-height: 80px; resize: vertical; }
  form.edit .hintline { font-size: 11px; color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; transition: .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .menu-btn, .tabs, .mobile-only { display: none; }
  .menu-list { display: grid; gap: 8px; }
  .menu-list .btn { text-align: left; padding: 10px 12px; }
  .menu-list .btn small { display: block; color: var(--muted); font-size: 12px; white-space: normal; }
  .steps { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .steps li { margin-bottom: 4px; }
  .todo-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: #3b2f12; color: var(--d0); vertical-align: 1px; }
  .todo-pill { margin-left: 6px; font-size: 11px; font-weight: 600; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--d0); background: #3b2f12; color: var(--d0); }
  .todo-switch { display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: center; padding: 10px 12px; margin-bottom: 14px;
    border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; }
  .todo-switch.on { border-color: var(--d0); background: #2a2412; }
  .todo-switch input { position: absolute; opacity: 0; pointer-events: none; }
  .todo-switch .track { width: 42px; height: 24px; border-radius: 12px; background: #34405a; position: relative; transition: background .15s; }
  .todo-switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .todo-switch.on .track { background: var(--d0); }
  .todo-switch.on .knob { left: 21px; }
  .todo-switch small { display: block; color: var(--muted); font-size: 12px; }
  label.check { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  label.check input { width: auto; }
  label.check .hintline { width: 100%; }

  /* ---------- Handy ---------- */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: 100vh; height: 100dvh; }
    header { padding: 8px 12px; gap: 8px; min-height: 52px; }
    header .stats, header .status, #layout, #btnFile, #btnExport, #btnImport, .hint { display: none; }
    .menu-btn { display: inline-block; font-size: 18px; line-height: 1; padding: 6px 12px 8px; }
    .mobile-only { display: revert; }
    aside, main { grid-column: 1; grid-row: 2; min-height: 0; }
    body.tab-graph aside, body.tab-list main { display: none; }
    /* Detailansicht liegt im Netz-Bereich – auch im Tab „Kontakte“ anzeigen, das 3D-Bild aber nicht */
    body.tab-list main:has(.panel.open) { display: flex; }
    body.tab-list .stage { display: none; }
    aside { border-right: 0; }
    .tabs { display: flex; grid-column: 1; grid-row: 3; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .tabs button { flex: 1; background: none; border: 0; padding: 12px 0 10px; color: var(--muted); font-size: 14px; touch-action: manipulation; }
    .tabs button.on { color: var(--accent); font-weight: 600; }
    .panel { position: fixed; inset: 0; width: 100%; z-index: 20; border-left: 0; display: none;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    .panel.open { display: flex; width: 100%; }
    .panel > * { min-width: 0; }
    .legend { flex-wrap: wrap; gap: 4px 10px; left: 10px; right: 10px; bottom: 10px; font-size: 11px; }
    .search input, form.edit input, form.edit select, form.edit textarea, .addlink { font-size: 16px; }
    .item { padding: 11px 14px; }
    .chip { padding: 4px 10px; font-size: 13px; }
    .chips { max-height: 84px; }
    button { touch-action: manipulation; }
    .toast { bottom: calc(72px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body class="tab-list">
<div class="app">
  <header>
    <h1>Mein Netzwerk</h1>
    <span class="stats" id="stats"></span>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <select class="btn" id="layout" title="Darstellung">
      <option value="radialout">Radial (Ich in der Mitte)</option>
      <option value="td">Baum (von oben)</option>
      <option value="">Frei (Kräfte)</option>
    </select>
    <button class="btn" id="btnFile" title="Automatisch in eine Datei auf deinem Laptop mitspeichern">Speicherdatei…</button>
    <button class="btn" id="btnExport" title="Backup als JSON-Datei herunterladen">Export</button>
    <button class="btn" id="btnImport" title="Backup-Datei (.json) oder Adressbuch-Export (.vcf) laden">Import</button>
    <input type="file" id="importFile" accept=".json,application/json,text/plain,.vcf,text/vcard,text/x-vcard" hidden>
    <button class="btn menu-btn" id="btnMenu" aria-label="Menü">⋯</button>
    <button class="btn primary" id="btnAdd">+ Kontakt</button>
  </header>

  <aside>
    <div class="search">
      <input id="q" type="search" placeholder="Suchen: Name, Beruf, Firma, wofür …" autocomplete="off">
      <div>
        <div class="filter-label">Themen <button id="addTopic">+ Thema</button></div>
        <div class="chips" id="topicChips"></div>
      </div>
      <div>
        <div class="filter-label">Grad</div>
        <div class="chips" id="degreeChips"></div>
      </div>
      <div>
        <div class="filter-label">Wofür nützlich <button id="clearFilters" hidden>Filter zurücksetzen</button></div>
        <div class="chips" id="tagChips"></div>
      </div>
    </div>
    <div class="list-head" id="listHead"></div>
    <div class="list" id="list"></div>
  </aside>

  <main>
    <div class="stage">
    <div id="graph"></div>
    <div class="viewtoggle" id="viewToggle" hidden>
      <button data-view="pruned" title="Nur die Treffer und die Personen auf dem Weg dorthin">Nur Treffer-Baum</button>
      <button data-view="all" title="Ganzes Netz, Rest abgedunkelt">Ganzes Netz</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--d0)"></i>Ich</span>
      <span><i style="background:var(--d1)"></i>1. Grad</span>
      <span><i style="background:var(--d2)"></i>2. Grad</span>
      <span><i style="background:var(--d3)"></i>3.+ Grad</span>
      <span><i class="dash"></i>Kennen sich auch</span>
    </div>
    <div class="hint">Ziehen = drehen · Rechtsklick ziehen = verschieben · Mausrad = zoomen</div>
    <div class="graphbtns">
      <button id="btnSpin" title="Netz langsam drehen lassen">↻ Drehen</button>
      <button id="btnFit" title="Alles ins Bild holen">⤢ Alles zeigen</button>
    </div>
    </div>

    <section class="panel" id="panel">
      <div class="panel-head" id="panelHead"></div>
      <div class="panel-body" id="panelBody"></div>
      <div class="panel-foot" id="panelFoot"></div>
    </section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-tab="list" class="on">Kontakte</button>
    <button data-tab="graph">Netz</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="lib/graph-libs.js"></script>
<script>
'use strict';

/* ---------- Daten ---------- */
const STORE_KEY = 'netzwerk.v1';
const DEG_COLORS = ['#fbbf24', '#5eead4', '#a78bfa', '#fb923c'];
const CROSS_COLOR = '#f472b6';
const $ = sel => document.querySelector(sel);

let data = loadLocal();
let fileHandle = null;

// u = Zeitpunkt der letzten Änderung eines Eintrags, deleted = gelöschte Einträge (für das Zusammenführen)
// contactKeys = Nummern/Adressen, die schon einmal aus dem Adressbuch übernommen wurden (damit nichts doppelt kommt)
function emptyData() { return { version: 3, meName: 'Ich', meNameU: 0, updatedAt: 0, people: [], links: [], topics: [], deleted: {}, contactKeys: {} }; }

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { console.warn('Laden fehlgeschlagen', e); }
  return emptyData();
}

function normalize(d) {
  const out = emptyData();
  if (!d || !Array.isArray(d.people)) throw new Error('Ungültige Datei');
  out.meName = d.meName || 'Ich';
  out.meNameU = +d.meNameU || 0;
  out.updatedAt = d.updatedAt || 0;
  if (d.deleted && typeof d.deleted === 'object') Object.entries(d.deleted).forEach(([k, t]) => { if (+t) out.deleted[k] = +t; });
  if (d.contactKeys && typeof d.contactKeys === 'object') Object.entries(d.contactKeys).forEach(([k, t]) => { if (+t) out.contactKeys[k] = +t; });
  out.people = d.people.filter(p => p && p.id && p.name).map(p => ({
    id: String(p.id), name: String(p.name), via: p.via ? String(p.via) : 'me',
    role: p.role || '', company: p.company || '',
    tags: Array.isArray(p.tags) ? p.tags.map(String).filter(Boolean) : [],
    phone: p.phone || '', email: p.email || '', reach: p.reach || '', location: p.location || '',
    strength: Math.min(5, Math.max(1, +p.strength || 3)), lastContact: p.lastContact || '', notes: p.notes || '',
    todo: !!p.todo, u: +p.u || 0
  }));
  const ids = new Set(out.people.map(p => p.id));
  out.people.forEach(p => { if (p.via !== 'me' && !ids.has(p.via)) p.via = 'me'; });
  // Zyklen auflösen
  const byId = new Map(out.people.map(p => [p.id, p]));
  out.people.forEach(p => {
    const seen = new Set([p.id]); let cur = p.via;
    while (cur !== 'me') { if (seen.has(cur)) { p.via = 'me'; break; } seen.add(cur); cur = byId.get(cur).via; }
  });
  // Querverbindungen: beide Personen müssen existieren, keine Doppelten
  const seenLinks = new Set();
  out.links = (Array.isArray(d.links) ? d.links : [])
    .filter(l => l && ids.has(String(l.a)) && ids.has(String(l.b)) && String(l.a) !== String(l.b))
    .map(l => ({ id: String(l.id || newId()), a: String(l.a), b: String(l.b), u: +l.u || 0 }))
    .filter(l => { const k = edgeKey(l.a, l.b); if (seenLinks.has(k)) return false; seenLinks.add(k); return true; });
  out.topics = (Array.isArray(d.topics) ? d.topics : []).filter(t => t && t.name).map(t => ({
    id: String(t.id || newId()), name: String(t.name),
    keywords: Array.isArray(t.keywords) ? t.keywords.map(String).filter(Boolean) : [],
    u: +t.u || 0
  }));
  return out;
}

// Zwei Stände zusammenführen (z. B. Laptop + Handy): pro Eintrag gewinnt die neuere Änderung,
// Gelöschtes bleibt gelöscht, außer es wurde danach noch einmal bearbeitet.
function mergeData(a, b) {
  const out = emptyData();
  const del = { ...a.deleted };
  Object.entries(b.deleted).forEach(([k, t]) => { if (!(del[k] >= t)) del[k] = t; });
  const pick = (listA, listB, keyFn, tombFn) => {
    const m = new Map();
    [...listA, ...listB].forEach(x => { const k = keyFn(x), cur = m.get(k); if (!cur || x.u > cur.u) m.set(k, x); });
    return [...m.values()].filter(x => !(del[tombFn(x)] >= x.u));
  };
  out.people = pick(a.people, b.people, p => p.id, p => p.id);
  out.links = pick(a.links, b.links, l => edgeKey(l.a, l.b), l => 'L:' + edgeKey(l.a, l.b));
  out.topics = pick(a.topics, b.topics, t => t.id, t => t.id);
  const nameSrc = (b.meNameU || 0) > (a.meNameU || 0) ? b : a;
  out.meName = nameSrc.meName; out.meNameU = nameSrc.meNameU || 0;
  out.deleted = del;
  out.contactKeys = { ...a.contactKeys };
  Object.entries(b.contactKeys || {}).forEach(([k, t]) => { if (!(out.contactKeys[k] >= t)) out.contactKeys[k] = t; });
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return normalize(JSON.parse(JSON.stringify(out)));
}

/* ---------- Abgeleitete Strukturen ---------- */
let byId, kids, crossOf, depthOf, bfsParent;
function index() {
  byId = new Map(data.people.map(p => [p.id, p]));
  kids = new Map();
  data.people.forEach(p => { if (!kids.has(p.via)) kids.set(p.via, []); kids.get(p.via).push(p); });
  kids.forEach(arr => arr.sort(byName));
  crossOf = new Map();
  data.links.forEach(l => [l.a, l.b].forEach(x => { if (!crossOf.has(x)) crossOf.set(x, []); crossOf.get(x).push(l); }));
  // Kürzeste Wege von mir aus, über eingetragene Wege und Querverbindungen (Breitensuche).
  // Eingetragene Wege werden zuerst probiert und gewinnen bei gleicher Länge.
  depthOf = new Map([['me', 0]]); bfsParent = new Map();
  const queue = ['me'];
  for (let i = 0; i < queue.length; i++) {
    const id = queue[i];
    const nbs = (kids.get(id) || []).map(c => c.id);
    if (id !== 'me') nbs.push(byId.get(id).via);
    nbs.push(...partnersOf(id));
    nbs.forEach(nb => { if (!depthOf.has(nb)) { depthOf.set(nb, depthOf.get(id) + 1); bfsParent.set(nb, id); queue.push(nb); } });
  }
}
const byName = (a, b) => a.name.localeCompare(b.name, 'de');
const nameOf = id => id === 'me' ? data.meName : (byId.get(id) || {}).name || '?';
const firstName = id => nameOf(id).split(' ')[0];
const colorOf = id => DEG_COLORS[Math.min(3, depthOf.get(id) || 0)];
function edgeKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
const isTreeEdge = (a, b) => (byId.get(b) || {}).via === a || (byId.get(a) || {}).via === b;
const partnersOf = id => (crossOf.get(id) || []).map(l => l.a === id ? l.b : l.a);
// Eingetragener Weg (über wen ich die Person kennengelernt habe)
function pathTo(id) { const p = []; let cur = id; while (cur && cur !== 'me') { p.unshift(cur); cur = byId.get(cur).via; } p.unshift('me'); return p; }
// Kürzester Weg, auch über Querverbindungen
function bestPath(id) { const p = [id]; while (p[0] !== 'me') p.unshift(bfsParent.get(p[0])); return p; }
function descendants(id) { const s = new Set(); const walk = i => (kids.get(i) || []).forEach(c => { s.add(c.id); walk(c.id); }); walk(id); return s; }
function treeOrder() { const out = []; const walk = (id, d) => (kids.get(id) || []).forEach(c => { out.push([c, d]); walk(c.id, d + 1); }); walk('me', 1); return out; }
function allTags() {
  const m = new Map();
  data.people.forEach(p => p.tags.forEach(t => { const k = t.toLowerCase(); const e = m.get(k) || { label: t, n: 0 }; e.n++; m.set(k, e); }));
  return [...m.entries()].sort((a, b) => b[1].n - a[1].n || a[0].localeCompare(b[0], 'de'));
}

/* ---------- Filter & Themen ---------- */
const filter = { q: '', tags: new Set(), degrees: new Set(), topic: null, todo: false };
let pruned = true;   // bei aktivem Filter nur den Treffer-Baum zeigen
const fold = s => (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const filterActive = () => !!(filter.q.trim() || filter.tags.size || filter.degrees.size || filter.topic || filter.todo);
// Übernommene, noch nicht bearbeitete Kontakte ohne eigene Verbindungen bleiben aus dem Netz raus, sonst wird es unübersichtlich
const hiddenTodo = p => p.todo && !(kids.get(p.id) || []).length && !partnersOf(p.id).length;
const todoCount = () => data.people.filter(p => p.todo).length;
const showPruned = () => filterActive() && pruned;
const topicById = id => data.topics.find(t => t.id === id);
const hayOf = p => fold([p.name, p.role, p.company, p.tags.join(' '), p.notes, p.location, p.reach, p.email, p.phone].join(' '));
const parseList = s => [...new Set((s || '').split(',').map(x => x.trim()).filter(Boolean))];

// Ein Kontakt passt zu einem Thema, wenn eines der Stichworte irgendwo bei ihm vorkommt
function topicMatches(p, keywords) {
  const hay = hayOf(p);
  return keywords.some(k => { const f = fold(k).trim(); return f && hay.includes(f); });
}

function matches(p) {
  const d = Math.min(3, depthOf.get(p.id));
  if (filter.todo && !p.todo) return false;
  if (filter.degrees.size && !filter.degrees.has(d)) return false;
  if (filter.tags.size && !p.tags.some(t => filter.tags.has(t.toLowerCase()))) return false;
  if (filter.topic) { const t = topicById(filter.topic); if (t && !topicMatches(p, t.keywords)) return false; }
  const words = fold(filter.q).split(/\s+/).filter(Boolean);
  if (words.length) {
    const hay = hayOf(p);
    if (!words.every(w => hay.includes(w))) return false;
  }
  return true;
}

let matchSet = new Set(), trailSet = new Set();
function computeMatches() {
  matchSet = new Set(); trailSet = new Set();
  if (filter.topic && !topicById(filter.topic)) filter.topic = null;
  if (!filterActive()) return;
  data.people.forEach(p => { if (matches(p)) { matchSet.add(p.id); bestPath(p.id).forEach(i => trailSet.add(i)); } });
}

/* ---------- Feste 3D-Anordnung ----------
   Statt einer Physik-Simulation (die zittert und Punkte übereinanderschiebt) bekommt jeder Kontakt einen
   festen Platz: Ich in der Mitte, direkte Kontakte gleichmäßig auf einer Kugel drumherum, deren Kontakte
   in einem Kegel weiter außen hinter ihnen – und so weiter. */
const LEVEL = 65;
let layoutMode = 'radial';   // radial | td | free
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
function fibSphere(n) {
  if (n === 1) return [new THREE.Vector3(0, 0, 1)];
  return Array.from({ length: n }, (_, i) => {
    const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), a = i * GOLDEN;
    return new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a));
  });
}
// Wenige direkte Kontakte: als Stern zur Kamera hin auffächern (sonst stehen zwei Äste genau hintereinander)
const VIEW0 = new THREE.Vector3(0.45, 0.35, 1).normalize();
function fanDirs(n) {
  const a = new THREE.Vector3(0, 1, 0).addScaledVector(VIEW0, -VIEW0.y).normalize(), b = new THREE.Vector3().crossVectors(a, VIEW0);
  return Array.from({ length: n }, (_, i) => {
    const t = Math.PI / 2 + i * 2 * Math.PI / n + (n === 2 ? 0.5 : 0);
    return a.clone().multiplyScalar(Math.sin(t)).addScaledVector(b, Math.cos(t)).addScaledVector(VIEW0, i % 2 ? 0.3 : -0.3).normalize();
  });
}
function fibCap(dir, angle, n, depth = 1) {
  if (n === 1) {
    // Einzelnes Kind leicht seitlich versetzt, damit Ketten nicht zu einer geraden Linie werden
    const side = new THREE.Vector3().crossVectors(dir, Math.abs(dir.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0)).normalize();
    return [dir.clone().applyAxisAngle(side, depth % 2 ? 0.35 : -0.35)];
  }
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
  const minCos = Math.cos(angle);
  return Array.from({ length: n }, (_, i) => {
    const cz = 1 - (i + 0.5) / n * (1 - minCos), s = Math.sqrt(1 - cz * cz), a = i * GOLDEN;
    return new THREE.Vector3(s * Math.cos(a), s * Math.sin(a), cz).applyQuaternion(q).normalize();
  });
}
function radialLayout(ids, parentOf) {
  const childMap = new Map(), size = new Map();
  ids.forEach(id => { if (id === 'me') return; const p = parentOf(id); if (!childMap.has(p)) childMap.set(p, []); childMap.get(p).push(id); });
  const calc = id => { let s = 1; (childMap.get(id) || []).forEach(c => s += calc(c)); size.set(id, s); return s; };
  calc('me');
  const pos = new Map([['me', new THREE.Vector3()]]);
  const place = (id, dir, cone, depth) => {
    const ch = (childMap.get(id) || []).sort((a, b) => size.get(b) - size.get(a) || nameOf(a).localeCompare(nameOf(b), 'de'));
    if (!ch.length) return;
    // Platz je nach Anzahl: wenige Kontakte bekommen viel Raum, viele werden enger, aber nie aufeinander
    const dirs = id === 'me' ? (ch.length <= 6 ? fanDirs(ch.length) : fibSphere(ch.length)) : fibCap(dir, cone * 0.8, ch.length, depth);
    const childCone = id === 'me' ? Math.min(1.1, Math.sqrt(Math.PI / ch.length)) : Math.max(0.12, cone / Math.sqrt(ch.length + 1));
    // Große Teilbäume nicht alle nebeneinander, sondern über die ganze Kugel verstreut
    const slot = [], used = new Set();
    ch.forEach((c, i) => { let k = Math.floor(((i * 0.6180339887) % 1) * ch.length); while (used.has(k)) k = (k + 1) % ch.length; used.add(k); slot.push(k); });
    ch.forEach((c, i) => {
      const d = dirs[slot[i]];
      // Bei vielen Geschwistern abwechselnd etwas weiter außen, damit Beschriftungen sich nicht decken
      const stagger = ch.length > 8 ? (i % 2) * 0.35 * LEVEL : 0;
      pos.set(c, d.clone().multiplyScalar((depth + 1) * LEVEL + stagger));
      place(c, d, childCone, depth + 1);
    });
  };
  place('me', null, Math.PI, 0);
  return pos;
}

// Weiches Gleiten an die neuen Plätze, gezählt in Rechenschritten (läuft so auch auf langsamen Handys zu Ende)
let tweenT = 1;
function stepTween() {
  // Freie Anordnung: Ich bleibt trotzdem fest in der Mitte (die Bibliothek setzt das beim Umschalten zurück)
  if (layoutMode === 'free') { const me = nodeCache.get('me'); if (me) { me.fx = me.fy = me.fz = 0; } }
  if (tweenT >= 1) return;
  tweenT = Math.min(1, tweenT + 1 / 35);
  const e = 1 - Math.pow(1 - tweenT, 3);
  Graph.graphData().nodes.forEach(n => {
    if (!n.__to) return;
    const f = n.__from || n.__to;
    ['x', 'y', 'z'].forEach(k => { n[k] = n['f' + k] = f[k] + (n.__to[k] - f[k]) * e; });
  });
}
function applyLayout(nodes, ids) {
  if (layoutMode !== 'radial') {
    nodes.forEach(n => { delete n.__to; delete n.__from; n.fx = n.fy = n.fz = undefined; });
    const me = nodes.find(n => n.id === 'me'); if (me) { me.fx = me.fy = me.fz = 0; }   // Ich bleibt in der Mitte
    tweenT = 1; return;
  }
  const pos = radialLayout(ids, showPruned() ? id => bfsParent.get(id) : id => byId.get(id).via);
  nodes.forEach(n => {
    const t = pos.get(n.id) || new THREE.Vector3();
    n.__from = n.x !== undefined ? new THREE.Vector3(n.x, n.y, n.z) : t.clone();
    n.__to = t;
    n.fx = n.__from.x; n.fy = n.__from.y; n.fz = n.__from.z;
  });
  tweenT = 0;
}
const targetPos = n => n.__to || (n.x !== undefined ? new THREE.Vector3(n.x, n.y, n.z) : null);
Graph.onEngineStop(() => {
  if (!graphEl.clientWidth) return; // 3D-Bild gerade versteckt (Handy, Tab „Kontakte“)
  if (!fitted) { fitCamera(); fitted = true; }
  else if (fitOnStop) { fitOnStop = false; fitView(); }
});
new ResizeObserver(() => Graph.width(graphEl.clientWidth).height(graphEl.clientHeight)).observe(graphEl);

function makeNodeObject(n) {
  const isMe = n.id === 'me';
  const p = byId.get(n.id);
  const r = isMe ? 7 : 2.6 + (p ? p.strength : 3) * 0.9;
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: colorOf(n.id), transparent: true, opacity: 0.95, emissive: 0x000000 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat);
  group.add(mesh);
  const label = new SpriteText(nameOf(n.id), isMe ? 6 : 4.4, '#e6ebf5');
  label.fontFace = 'Segoe UI, system-ui, sans-serif';
  label.fontWeight = isMe ? '700' : '500';
  label.material.depthWrite = false;
  label.position.y = r + 4;
  group.add(label);
  n.__mesh = mesh; n.__label = label;
  applyNodeStyle(n);
  return group;
}

function nodeState(id) {
  if (id === selected) return 'sel';
  if (!filterActive()) return 'on';
  if (id === 'me' || matchSet.has(id)) return 'on';
  return trailSet.has(id) ? 'trail' : 'off';
}
function applyNodeStyle(n) {
  if (!n.__mesh) return;
  const s = nodeState(n.id);
  const op = { sel: 1, on: 0.95, trail: 0.45, off: 0.08 }[s];
  n.__mesh.material.opacity = op;
  n.__mesh.material.emissive.set(s === 'sel' ? colorOf(n.id) : '#000000');
  n.__mesh.material.emissiveIntensity = 0.55;
  n.__mesh.scale.setScalar(s === 'sel' ? 1.45 : 1);
  n.__label.material.opacity = s === 'off' ? 0.06 : s === 'trail' ? 0.55 : 1;
  n.__label.color = s === 'sel' ? '#ffffff' : '#e6ebf5';
}

let selEdges = new Set();
function linkIds(l) { return [typeof l.source === 'object' ? l.source.id : l.source, typeof l.target === 'object' ? l.target.id : l.target]; }
function onSelPath(l) { const [s, t] = linkIds(l); return selEdges.has(edgeKey(s, t)); }

function refreshGraphStyle() {
  const path = selected && (selected === 'me' || byId.has(selected)) ? bestPath(selected) : [];
  selEdges = new Set(path.slice(1).map((id, i) => edgeKey(path[i], id)));
  nodeCache.forEach(applyNodeStyle);
  Graph
    .linkColor(l => {
      if (onSelPath(l)) return '#ffffff';
      const [, t] = linkIds(l);
      if (filterActive() && !trailSet.has(t)) return 'rgba(120,135,170,0.08)';
      return l.cross ? CROSS_COLOR : colorOf(t);
    })
    .linkWidth(l => onSelPath(l) ? 1.6 : 0.6)
    .linkDirectionalParticles(l => onSelPath(l) ? 3 : 0);
  classifyCross();
}

// Sichtbare Knoten: alles, oder im Treffer-Baum nur Treffer + Personen auf dem Weg dorthin
let visibleSet = new Set(), graphLinkKeys = new Set(), graphKey = '';
function visibleIds() {
  return showPruned()
    ? ['me', ...data.people.filter(p => trailSet.has(p.id)).map(p => p.id)]
    : ['me', ...data.people.filter(p => !hiddenTodo(p)).map(p => p.id)];
}

function rebuildGraph() {
  const ids = visibleIds();
  const nodes = ids.map(id => {
    let n = nodeCache.get(id);
    if (!n) {
      n = { id };
      // Neue Kontakte neben der Person starten lassen, über die man sie kennt
      const parent = id !== 'me' && nodeCache.get(byId.get(id).via);
      if (parent && parent.x !== undefined) ['x', 'y', 'z'].forEach(k => n[k] = parent[k] + (Math.random() - 0.5) * 20);
      nodeCache.set(id, n);
    }
    return n;
  });
  const alive = new Set(['me', ...data.people.map(p => p.id)]);
  [...nodeCache.keys()].forEach(id => { if (!alive.has(id)) nodeCache.delete(id); });
  // Im Treffer-Baum folgen die Linien den kürzesten Wegen (auch über Querverbindungen)
  const links = showPruned()
    ? ids.filter(id => id !== 'me').map(id => { const s = bfsParent.get(id); return { source: s, target: id, cross: !isTreeEdge(s, id) }; })
    : data.people.filter(p => !hiddenTodo(p)).map(p => ({ source: p.via, target: p.id, cross: false }));
  visibleSet = new Set(ids);
  graphLinkKeys = new Set(links.map(l => edgeKey(l.source, l.target)));
  graphKey = ids.join(',') + '#' + showPruned();
  applyLayout(nodes, ids);
  Graph.cooldownTicks(layoutMode === 'radial' ? 45 : 250);
  Graph.graphData({ nodes, links });
  Graph.nodeThreeObject(makeNodeObject); // Beschriftungen/Farben neu aufbauen
  refreshGraphStyle();
}

/* Querverbindungen als gestrichelte Linien, die das Baum-Layout nicht verziehen */
const crossLayers = {};
[['norm', CROSS_COLOR, 0.65], ['dim', CROSS_COLOR, 0.07], ['hi', '#ffffff', 0.95]].forEach(([k, color, opacity]) => {
  const mat = new THREE.LineDashedMaterial({ color, dashSize: 3, gapSize: 2.2, transparent: true, opacity, depthWrite: false });
  const obj = new THREE.LineSegments(new THREE.BufferGeometry(), mat);
  obj.frustumCulled = false; obj.visible = false;
  Graph.scene().add(obj);
  crossLayers[k] = obj;
});
let crossPairs = { norm: [], dim: [], hi: [] };
function classifyCross() {
  crossPairs = { norm: [], dim: [], hi: [] };
  data.links.forEach(l => {
    const k = edgeKey(l.a, l.b);
    if (!visibleSet.has(l.a) || !visibleSet.has(l.b) || graphLinkKeys.has(k)) return;
    const cls = selEdges.has(k) ? 'hi' : (filterActive() && !(trailSet.has(l.a) && trailSet.has(l.b))) ? 'dim' : 'norm';
    crossPairs[cls].push([l.a, l.b]);
  });
}
function drawCross() {
  for (const k in crossLayers) {
    const obj = crossLayers[k], pairs = crossPairs[k];
    if (!pairs.length) { obj.visible = false; continue; }
    let attr = obj.geometry.getAttribute('position');
    if (!attr || attr.count !== pairs.length * 2) {
      attr = new THREE.BufferAttribute(new Float32Array(pairs.length * 6), 3);
      obj.geometry.setAttribute('position', attr);
    }
    pairs.forEach(([a, b], i) => {
      const A = nodeCache.get(a), B = nodeCache.get(b);
      if (A && B) attr.array.set([A.x || 0, A.y || 0, A.z || 0, B.x || 0, B.y || 0, B.z || 0], i * 6);
    });
    attr.needsUpdate = true;
    obj.computeLineDistances();
    obj.visible = true;
  }
  requestAnimationFrame(drawCross);
}
requestAnimationFrame(drawCross);

// Warten, bis der Knoten nach einer Datenänderung an seinem Platz ist
function flyWhenSettled(id, tries = 0, last = null, startTick = engineTicks) {
  const n = nodeCache.get(id);
  const pos = n && n.x !== undefined ? [n.x, n.y, n.z] : null;
  const moved = !pos || !last || Math.hypot(pos[0] - last[0], pos[1] - last[1], pos[2] - last[2]) > 1.5;
  if ((moved || engineTicks - startTick < 40) && tries < 40) return setTimeout(() => flyWhenSettled(id, tries + 1, pos, startTick), 150);
  flyTo(id);
}

function flyTo(id) {
  const n = nodeCache.get(id); if (!n || n.x === undefined || !visibleSet.has(id)) return;
  // Blickrichtung beibehalten, nur auf den Kontakt zufliegen
  const cam = Graph.camera().position, tgt = Graph.controls().target;
  const dir = new THREE.Vector3(tgt.x - cam.x, tgt.y - cam.y, tgt.z - cam.z);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize().multiplyScalar(170);
  Graph.cameraPosition({ x: n.x - dir.x, y: n.y - dir.y, z: n.z - dir.z }, { x: n.x, y: n.y, z: n.z }, 900);
}

let fitTimer;
function scheduleFit(waitForLayout) {
  clearTimeout(fitTimer);
  fitOnStop = waitForLayout;
  fitTimer = setTimeout(fitView, waitForLayout ? 900 : 450);
}
function fitView() {
  if (selected || !fitted || !graphEl.clientWidth) return;
  const active = filterActive();
  if (active && !matchSet.size) return;
  fitCamera(n => !active || showPruned() || n.id === 'me' || matchSet.has(n.id));
}

// Alles ins Bild holen, aus der aktuellen Blickrichtung (das Netz ist rund, gedreht wird von Hand)
function fitCamera(nodeFilter = () => true, ms = 700) {
  const pts = Graph.graphData().nodes.filter(n => targetPos(n) && nodeFilter(n)).map(targetPos);
  if (!pts.length || !graphEl.clientWidth) return;
  const cam = Graph.camera();
  const c = new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
  const R = Math.max(30, ...pts.map(p => p.distanceTo(c))) + 18;
  const vfov = cam.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * cam.aspect);
  const dist = Math.max(110, R / Math.sin(Math.min(vfov, hfov) / 2));
  const dir = fitted ? cam.position.clone().sub(controls.target) : new THREE.Vector3(0.45, 0.35, 1);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
  dir.normalize();
  cam.up.set(0, 1, 0);
  const pos = c.clone().addScaledVector(dir, dist);
  Graph.cameraPosition({ x: pos.x, y: pos.y, z: pos.z }, { x: c.x, y: c.y, z: c.z }, ms);
}

function pathHtml(path) {
  return `<div class="path">${path.map((id, i) => {
    const node = i === path.length - 1 ? `<b>${esc(nameOf(id))}</b>` : `<a data-go="${esc(id)}">${esc(nameOf(id))}</a>`;
    if (i === 0) return node;
    const cross = !isTreeEdge(path[i - 1], id);
    return `<span class="arr${cross ? ' cross' : ''}" title="${cross ? 'Kennen sich (Querverbindung)' : ''}">${cross ? '↔' : '→'}</span>${node}`;
  }).join('')}</div>`;
}

// Schalter „zu bearbeiten“. In der Bearbeiten-Liste geht es danach direkt mit dem nächsten Kontakt weiter.
function setTodo(id, on) {
  const p = byId.get(id); if (!p) return;
  const queue = filter.todo ? data.people.filter(x => x.todo && matchSet.has(x.id)).sort(byName) : [];
  const pos = queue.findIndex(x => x.id === id);
  p.todo = on; p.u = Date.now();
  save(); index(); computeMatches();
  if (!on && filter.todo) {
    const next = queue.slice(pos + 1).concat(queue.slice(0, pos)).find(x => x.todo);
    update();
    if (next) { select(next.id, false); toast(`Erledigt – weiter mit ${next.name}`); }
    else { filter.todo = false; selected = id; update(); renderPanel(); toast('Alle Kontakte bearbeitet 🎉'); }
    return;
  }
  update(); renderPanel();
  toast(on ? 'Auf „zu bearbeiten“ gesetzt' : 'Als fertig markiert');
}

/* ---------- Querverbindungen ---------- */
function addLink(a, b) {
  if (!b || a === b || partnersOf(a).includes(b)) return;
  data.links.push({ id: newId(), a, b, u: Date.now() });
  save(); fullUpdate(); toast(`${nameOf(a)} ↔ ${nameOf(b)} verbunden`);
}
function removeLink(a, b) {
  const k = edgeKey(a, b);
  data.links = data.links.filter(l => edgeKey(l.a, l.b) !== k);
  data.deleted['L:' + k] = Date.now();
  save(); fullUpdate(); toast('Verbindung entfernt');
}

function submitForm(id, fd) {
  const name = (fd.get('name') || '').trim(); if (!name) return;
  if (id === 'me') { data.meName = name; data.meNameU = Date.now(); panelMode = 'view'; save(); fullUpdate(); return; }
  const rec = {
    name, via: fd.get('via') || 'me', role: fd.get('role').trim(), company: fd.get('company').trim(),
    tags: parseList(fd.get('tags')),
    phone: fd.get('phone').trim(), email: fd.get('email').trim(), reach: fd.get('reach').trim(),
    location: fd.get('location').trim(), strength: +fd.get('strength') || 3,
    lastContact: fd.get('lastContact'), notes: fd.get('notes').trim(), todo: fd.get('todo') === 'on', u: Date.now()
  };
  let targetId = id;
  // Haken bei „zu bearbeiten“ entfernt: wie der Schalter behandeln (geht in der Liste zum nächsten weiter)
  const finishing = id && byId.get(id).todo && !rec.todo;
  if (finishing) rec.todo = true;
  if (id) Object.assign(byId.get(id), rec);
  else { targetId = newId(); data.people.push({ id: targetId, ...rec }); }
  // Eine Querverbindung, die jetzt der eingetragene Weg ist, wird überflüssig
  const dup = edgeKey(targetId, rec.via);
  if (data.links.some(l => edgeKey(l.a, l.b) === dup)) {
    data.links = data.links.filter(l => edgeKey(l.a, l.b) !== dup);
    data.deleted['L:' + dup] = Date.now();
  }
  panelMode = 'view'; selected = targetId;
  save(); fullUpdate();
  if (finishing) return setTodo(id, false);
  toast(id ? 'Gespeichert' : `${name} hinzugefügt`);
  flyWhenSettled(targetId);
}

function removePerson(id) {
  const p = byId.get(id); const n = (kids.get(id) || []).length;
  const msg = `${p.name} wirklich löschen?` + (n ? `\n\nDie ${n} Kontakt(e), die du über ${p.name} kennst, hängen danach an ${nameOf(p.via)}.` : '');
  if (!confirm(msg)) return;
  const now = Date.now();
  data.people.forEach(c => { if (c.via === id) { c.via = p.via; c.u = now; } });
  data.people = data.people.filter(c => c.id !== id);
  data.links = data.links.filter(l => l.a !== id && l.b !== id);
  data.deleted[id] = now;
  selected = p.via === 'me' ? null : p.via;
  save(); fullUpdate(); toast(`${p.name} gelöscht`);
}

function submitTopic(fd) {
  const name = (fd.get('name') || '').trim(), keywords = parseList(fd.get('keywords'));
  if (!name) return;

function deleteTopic() {
  const t = topicById(topicDraft.id); if (!t) return;
  if (!confirm(`Thema „${t.name}“ löschen?\nDeine Kontakte bleiben erhalten.`)) return;
  data.topics = data.topics.filter(x => x.id !== t.id);
  data.deleted[t.id] = Date.now();
  if (filter.topic === t.id) filter.topic = null;
  panelMode = 'view';
  save(); fullUpdate(); scheduleFit(true);
  toast('Thema gelöscht');
}

/* ---------- Speichern in Datei / Export / Import ---------- */
function setStatus(msg, warn) {
  const el = $('#status');
  if (msg) { el.textContent = msg; el.classList.toggle('warn', !!warn); return; }
  el.classList.remove('warn');
  if (!data.updatedAt) { el.textContent = ''; return; }
  const t = new Date(data.updatedAt).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  el.textContent = fileHandle ? `Gespeichert ${t} · Browser + ${fileHandle.name}` : `Gespeichert ${t} · im Browser`;
}

async function writeFile() {
  if (!fileHandle) return;
  try {
    if ((await fileHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') { setStatus('Speicherdatei getrennt – bitte neu verbinden', true); return; }
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(data, null, 2)); await w.close();
    setStatus();
  } catch (e) { console.warn(e); setStatus('Schreiben in Datei fehlgeschlagen', true); }
}

// Datei-Handle in IndexedDB merken, damit die Verknüpfung einen Neustart überlebt
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('netzwerk', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('kv', mode); const q = fn(tx.objectStore('kv')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };
  });
}

let pendingHandle = null;
async function initFileHandle() {
  if (!window.showSaveFilePicker) { $('#btnFile').hidden = true; return; }
  try { pendingHandle = await idb('readonly', s => s.get('file')); } catch (e) { return; }
  if (!pendingHandle) return;
  if ((await pendingHandle.queryPermission({ mode: 'readwrite' })) === 'granted') { await connectHandle(pendingHandle); return; }
  $('#btnFile').textContent = `Mit ${pendingHandle.name} verbinden`;
  $('#btnFile').classList.add('primary');
}

async function connectHandle(h) {
  fileHandle = h; pendingHandle = null;
  $('#btnFile').textContent = h.name; $('#btnFile').classList.remove('primary');
  $('#btnFile').title = 'Wird bei jeder Änderung automatisch mitgespeichert. Klicken, um eine andere Datei zu wählen.';
  // Neueren Stand gewinnen lassen
  try {
    const text = await (await h.getFile()).text();
    if (text.trim()) {
      const fromFile = normalize(JSON.parse(text));
      if (fromFile.updatedAt > data.updatedAt) { data = fromFile; localStorage.setItem(STORE_KEY, JSON.stringify(data)); fullUpdate(); toast('Neuerer Stand aus Datei geladen'); setStatus(); return; }
    }
  } catch (e) { /* leere oder fremde Datei → überschreiben */ }
  await writeFile(); setStatus();
}

$('#btnFile').onclick = async () => {
  try {
    if (pendingHandle) {
      if ((await pendingHandle.requestPermission({ mode: 'readwrite' })) === 'granted') return connectHandle(pendingHandle);
    }
    const h = await showSaveFilePicker({ suggestedName: 'netzwerk.json', types: [{ description: 'Netzwerk-Daten', accept: { 'application/json': ['.json'] } }] });
    await idb('readwrite', s => s.put(h, 'file'));
    await connectHandle(h);
    toast(`Speichert ab jetzt automatisch in ${h.name}`);
  } catch (e) { if (e.name !== 'AbortError') toast('Datei konnte nicht verbunden werden'); }
};

// Export: am Handy über das Teilen-Menü (z. B. LocalSend oder „In Dateien sichern“), sonst als Download
async function exportData() {
  const name = `netzwerk-${new Date().toISOString().slice(0, 10)}.json`;
  const json = JSON.stringify(data, null, 2);
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare) {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { /* abgebrochen */ }
      return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Kontakte aus dem Adressbuch (vCard / .vcf) ---------- */
// Liest eine .vcf-Datei, wie sie die iPhone-Kontakte-App, Outlook oder Google exportieren
function parseVcf(text) {
  const lines = [];
  for (const l of text.replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').split('\n')) {
    const prev = lines[lines.length - 1];
    // Alte Exporte (quoted-printable) brechen Zeilen mit „=“ am Ende um
    if (prev && /QUOTED-PRINTABLE/i.test(prev.split(':')[0]) && prev.endsWith('=')) lines[lines.length - 1] = prev.slice(0, -1) + l;
    else lines.push(l);
  }
  const unesc = s => s.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1').trim();
  const qp = s => { try { return decodeURIComponent(s.replace(/%/g, '%25').replace(/=([0-9A-F]{2})/gi, '%$1')); } catch (e) { return s; } };
  const cards = []; let c = null;
  for (const line of lines) {
    if (/^BEGIN:VCARD/i.test(line)) { c = { tel: [], email: [] }; continue; }
    if (/^END:VCARD/i.test(line)) { if (c) cards.push(c); c = null; continue; }
    if (!c) continue;
    const i = line.indexOf(':'); if (i < 0) continue;
    const head = line.slice(0, i), params = head.split(';'), prop = params[0].replace(/^[^.]*\./, '').toUpperCase();
    let val = line.slice(i + 1);
    if (/ENCODING=QUOTED-PRINTABLE/i.test(head)) val = qp(val);
    const type = head.toUpperCase();
    if (prop === 'FN') c.fn = unesc(val);
    else if (prop === 'N') { const [fam, giv, mid] = val.split(';').map(unesc); c.n = [giv, mid, fam].filter(Boolean).join(' '); }
    else if (prop === 'TEL' && val.trim()) c.tel.push({ v: unesc(val.replace(/^tel:/i, '')), mobile: /CELL|IPHONE|MOBILE/.test(type) });
    else if (prop === 'EMAIL' && val.trim()) c.email.push(unesc(val));
    else if (prop === 'ORG') c.org = val.split(';').map(unesc).filter(Boolean).join(', ');
    else if (prop === 'TITLE') c.title = unesc(val);
    else if (prop === 'NOTE') c.note = unesc(val);
    else if (prop === 'ADR' && !c.city) c.city = unesc(val.split(';')[3] || '');
  }
  return cards.map(c => {
    c.tel.sort((a, b) => b.mobile - a.mobile);
    const tels = c.tel.map(t => t.v);
    const name = c.fn || c.n || c.org || tels[0] || c.email[0] || '';
    return { name, tels, emails: c.email, org: c.org || '', title: c.title || '', note: c.note || '', city: c.city || '' };
  }).filter(c => c.name);
}

// Nummern vergleichbar machen: 0171 12 34 = +49 171 1234 (deutsche Nummern ohne Vorwahl gelten als +49)
function phoneKey(s) {
  let d = String(s || '').replace(/[^\d+]/g, '');
  if (d.startsWith('00')) d = '+' + d.slice(2);
  else if (d.startsWith('0')) d = '+49' + d.slice(1);
  return d.replace(/\D/g, '').length >= 5 ? 'tel:' + d : '';
}
const mailKey = s => s && s.includes('@') ? 'mail:' + s.trim().toLowerCase() : '';
const nameKey = s => 'name:' + fold(s).replace(/\s+/g, ' ').trim();
function keysOfCard(c) { const k = [...c.tels.map(phoneKey), ...c.emails.map(mailKey)].filter(Boolean); return k.length ? k : [nameKey(c.name)]; }

let pendingContacts = null;
function openContactImport(text, fileName) {
  const cards = parseVcf(text);
  if (!cards.length) { alert('In der Datei wurden keine Kontakte gefunden.'); return; }
  // Was ist schon bekannt? Nummern/Mails der vorhandenen Personen + alles, was früher schon übernommen wurde
  const known = new Map();
  data.people.forEach(p => [phoneKey(p.phone), mailKey(p.email), nameKey(p.name)].filter(Boolean).forEach(k => known.set(k, p)));
  const fresh = [], existing = [], fill = [], seen = new Set();
  cards.forEach(c => {
    const keys = keysOfCard(c);
    if (keys.some(k => seen.has(k))) { existing.push(c); return; }   // doppelt in der Datei selbst
    keys.forEach(k => seen.add(k));
    const person = keys.map(k => known.get(k)).find(Boolean) || known.get(nameKey(c.name));
    if (person) { existing.push(c); if (!person.phone && c.tels.length) fill.push([person, c]); }
    else if (keys.some(k => data.contactKeys[k])) existing.push(c);   // früher übernommen und danach gelöscht
    else fresh.push(c);
  });
  pendingContacts = { cards, fresh, existing, fill, fileName };
  panelMode = 'contacts'; renderPanel();
}

function renderContactImport() {
  $('#panel').classList.add('open');
  const { cards, fresh, existing, fill, fileName } = pendingContacts;
  $('#panelHead').innerHTML = `<div><h2>Kontakte übernehmen</h2><div class="sub">${esc(fileName)}</div></div><button class="x" title="Abbrechen">×</button>`;
  $('#panelHead .x').onclick = () => { pendingContacts = null; cancelForm(); };
  const preview = fresh.slice(0, 30).map(c => `<li>${esc(c.name)}${c.tels[0] ? ` <span style="color:var(--muted)">${esc(c.tels[0])}</span>` : ''}</li>`).join('');
  $('#panelBody').innerHTML = `
    <div class="field"><div class="k">In der Datei</div><div class="v">${cards.length} Kontakte</div></div>
    <div class="field"><div class="k">Neu</div><div class="v"><b>${fresh.length}</b> Kontakte kommen dazu – als <span class="todo-tag">offen</span> markiert, direkt unter dir</div>
      ${fresh.length ? `<ul class="steps" style="margin-top:6px">${preview}${fresh.length > 30 ? `<li>… und ${fresh.length - 30} weitere</li>` : ''}</ul>` : ''}</div>
    <div class="field"><div class="k">Schon da</div><div class="v">${existing.length} Kontakte werden übersprungen${fill.length ? ` · bei ${fill.length} wird die fehlende Nummer ergänzt` : ''}</div>
      <div class="note">Erkannt an Telefonnummer, E-Mail oder Name. Wen du mal gelöscht hast, holt die App auch nicht wieder rein.</div></div>`;
  $('#panelFoot').innerHTML = `<button class="btn primary" id="cApply" ${fresh.length || fill.length ? '' : 'disabled'}>${fresh.length ? `${fresh.length} übernehmen` : 'Nummern ergänzen'}</button><button class="btn" id="cCancel">Abbrechen</button>`;
  $('#cCancel').onclick = () => { pendingContacts = null; cancelForm(); };
  $('#cApply').onclick = applyContactImport;
}

function applyContactImport() {
  const { cards, fresh, fill } = pendingContacts, now = Date.now();
  fresh.forEach(c => {
    const notes = [c.tels.length > 1 ? 'Weitere Nummern: ' + c.tels.slice(1).join(', ') : '', c.emails.length > 1 ? 'Weitere E-Mails: ' + c.emails.slice(1).join(', ') : '', c.note].filter(Boolean).join('\n');
    data.people.push({ id: newId(), name: c.name, via: 'me', role: c.title, company: c.org, tags: [], phone: c.tels[0] || '', email: c.emails[0] || '',
      reach: '', location: c.city, strength: 3, lastContact: '', notes, todo: true, u: now });
  });
  fill.forEach(([p, c]) => { p.phone = c.tels[0]; p.u = now; });
  cards.forEach(c => keysOfCard(c).forEach(k => data.contactKeys[k] = now));
  const n = fresh.length;
  pendingContacts = null; panelMode = 'view'; selected = null;
  if (n) { filter.todo = true; pruned = true; }
  save(); fullUpdate(); if (isMobile()) setTab('list');
  toast(n ? `${n} ${n === 1 ? 'Kontakt' : 'Kontakte'} übernommen – jetzt nach und nach bearbeiten` : 'Nummern ergänzt');
}

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { if (panelMode !== 'view') cancelForm(); else if (typing) document.activeElement.blur(); else closePanel(); }
});

function newId() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function formatDate(s) { const d = new Date(s + 'T00:00'); return isNaN(d) ? esc(s) : d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' }); }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
